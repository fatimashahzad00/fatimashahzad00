<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="495" height="195" rx="18"/></clipPath>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5ec4"/>
      <stop offset="100%" stop-color="#a05bff"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5ec4"/>
      <stop offset="100%" stop-color="#7ee8ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="495" height="195" fill="#170c26"/>
    <rect x="0" y="0" width="495" height="195" fill="url(#ringGrad)" opacity="0.04"/>
    <text x="20" y="26" font-family="'Poppins','Trebuchet MS',sans-serif" font-size="15" font-weight="700" fill="#f6ecff">Fatima's GitHub Stats</text>

    <g transform="translate(100,100)">
      <circle r="62" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
      <circle r="62" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90)" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" from="389.6" to="50.6" begin="0.3s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </circle>
      <text x="0" y="-4" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="30" font-weight="800" fill="#f6ecff" opacity="0">
        <animate attributeName="opacity" begin="1.2s" dur="0.6s" to="1" fill="freeze"/>A+</text>
      <text x="0" y="18" text-anchor="middle" font-family="Verdana, sans-serif" font-size="10.5" fill="#c9b6e8" opacity="0">
        <animate attributeName="opacity" begin="1.4s" dur="0.6s" to="1" fill="freeze"/>GRADE</text>
    </g>

    <g>
  <text x="210" y="46" font-family="Verdana, sans-serif" font-size="12" fill="#c9b6e8">Total Stars Earned</text>
  <text x="470" y="46" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#f6ecff" opacity="0">
    <animate attributeName="opacity" begin="1.40s" dur="0.01s" to="1" fill="freeze"/>128</text>
  <rect x="210" y="52" width="220" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="210" y="52" width="0" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="81.1" begin="0.90s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
  </rect>
  <g transform="translate(210,32)" opacity="0">
    <animate attributeName="opacity" begin="0.75s" dur="0.4s" to="1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="-14 0" to="0 0" begin="0.75s" dur="0.4s" fill="freeze"/>
  </g>
</g>
<g>
  <text x="210" y="72" font-family="Verdana, sans-serif" font-size="12" fill="#c9b6e8">Total Commits (2026)</text>
  <text x="470" y="72" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#f6ecff" opacity="0">
    <animate attributeName="opacity" begin="1.58s" dur="0.01s" to="1" fill="freeze"/>940</text>
  <rect x="210" y="78" width="220" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="210" y="78" width="0" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="119.1" begin="1.08s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
  </rect>
  <g transform="translate(210,58)" opacity="0">
    <animate attributeName="opacity" begin="0.93s" dur="0.4s" to="1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="-14 0" to="0 0" begin="0.93s" dur="0.4s" fill="freeze"/>
  </g>
</g>
<g>
  <text x="210" y="98" font-family="Verdana, sans-serif" font-size="12" fill="#c9b6e8">Total PRs</text>
  <text x="470" y="98" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#f6ecff" opacity="0">
    <animate attributeName="opacity" begin="1.76s" dur="0.01s" to="1" fill="freeze"/>58</text>
  <rect x="210" y="104" width="220" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="210" y="104" width="0" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="110.2" begin="1.26s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
  </rect>
  <g transform="translate(210,84)" opacity="0">
    <animate attributeName="opacity" begin="1.11s" dur="0.4s" to="1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="-14 0" to="0 0" begin="1.11s" dur="0.4s" fill="freeze"/>
  </g>
</g>
<g>
  <text x="210" y="124" font-family="Verdana, sans-serif" font-size="12" fill="#c9b6e8">Total Issues</text>
  <text x="470" y="124" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#f6ecff" opacity="0">
    <animate attributeName="opacity" begin="1.94s" dur="0.01s" to="1" fill="freeze"/>34</text>
  <rect x="210" y="130" width="220" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="210" y="130" width="0" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="64.6" begin="1.44s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
  </rect>
  <g transform="translate(210,110)" opacity="0">
    <animate attributeName="opacity" begin="1.29s" dur="0.4s" to="1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="-14 0" to="0 0" begin="1.29s" dur="0.4s" fill="freeze"/>
  </g>
</g>
<g>
  <text x="210" y="150" font-family="Verdana, sans-serif" font-size="12" fill="#c9b6e8">Contributed to (last year)</text>
  <text x="470" y="150" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#f6ecff" opacity="0">
    <animate attributeName="opacity" begin="2.12s" dur="0.01s" to="1" fill="freeze"/>21</text>
  <rect x="210" y="156" width="220" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="210" y="156" width="0" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="79.8" begin="1.62s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
  </rect>
  <g transform="translate(210,136)" opacity="0">
    <animate attributeName="opacity" begin="1.47s" dur="0.4s" to="1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="-14 0" to="0 0" begin="1.47s" dur="0.4s" fill="freeze"/>
  </g>
</g>
    <rect x="1" y="1" width="493" height="193" rx="17" fill="none" stroke="rgba(200,140,255,0.35)" stroke-width="1.3"/>
  </g>
</svg>