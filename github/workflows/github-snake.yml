name: Generate Snake Animation

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate custom-colored contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: fatimashahzad00
          # Light + dark variants, colored to match the pink/purple profile theme.
          # SMIL + CSS only under the hood (Platane/snk output is animated via CSS,
          # so it survives GitHub's JavaScript stripping when embedded as an <img>).
          outputs: |
            dist/github-snake.svg?color_snake=%23ff5ec4&color_dots=%23170c26,%232a1145,%23a05bff,%23ff5ec4,%237ee8ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff5ec4&color_dots=%23170c26,%232a1145,%23a05bff,%23ff5ec4,%237ee8ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake svg(s) to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
